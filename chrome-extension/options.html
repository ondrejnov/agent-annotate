<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Annotation Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #e5e5e5;
      padding: 32px;
    }
    .page {
      max-width: 560px;
      margin: 0 auto;
      background: #1f1f23;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .description {
      color: #a1a1aa;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .field {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      min-width: 0;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #e5e5e5;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      padding: 10px 12px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    button {
      background: #6366f1;
      border: 1px solid #6366f1;
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4f46e5; }
    .message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #71717a;
      word-break: break-word;
      line-height: 1.4;
    }
    .message.success { color: #86efac; }
    .message.error { color: #fca5a5; }
    .hint {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #27272a;
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="header">
      <span class="logo">Agent</span>
      <h1>Annotation Options</h1>
    </div>

    <p class="description">
      Configure the HTTP endpoint once. Clicking the extension icon will then start annotation immediately on the current tab.
    </p>

    <div class="label">HTTP Endpoint</div>
    <div class="field">
      <input type="url" id="endpoint-url" placeholder="http://localhost:3000/annotations">
      <button id="save-endpoint">Save</button>
    </div>
    <div class="message" id="endpoint-message"></div>

    <div class="hint">
      On submit, the extension sends a JSON POST request to the configured endpoint.
    </div>
  </main>

  <script src="options.js"></script>
</body>
</html>
