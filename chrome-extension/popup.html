<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #e5e5e5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title { font-size: 14px; font-weight: 600; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #27272a;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.checking { background: #eab308; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .status-text { font-size: 12px; flex: 1; }
    .section { margin-bottom: 14px; }
    .label {
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .field {
      display: flex;
      gap: 6px;
    }
    .field input {
      flex: 1;
      min-width: 0;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: #e5e5e5;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      padding: 8px 10px;
      outline: none;
    }
    .field input:focus { border-color: #6366f1; }
    .btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      color: #a1a1aa;
      font-size: 11px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover:not(:disabled) { background: #3f3f46; color: #e5e5e5; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.primary {
      background: #6366f1;
      border-color: #6366f1;
      color: white;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
    }
    .btn.primary:hover:not(:disabled) { background: #4f46e5; }
    .message {
      min-height: 16px;
      margin-top: 8px;
      font-size: 11px;
      color: #71717a;
      word-break: break-word;
      line-height: 1.4;
    }
    .message.success { color: #86efac; }
    .message.warning { color: #fde68a; }
    .message.error { color: #fca5a5; }
    .ready-content {
      text-align: center;
      padding: 4px 0 8px;
    }
    .ready-content p {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 12px;
    }
    .shortcut {
      display: inline-block;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 14px;
    }
    .footer {
      font-size: 11px;
      color: #52525b;
      padding-top: 12px;
      border-top: 1px solid #27272a;
      margin-top: 4px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Agent</span>
    <span class="title">Agent Annotation</span>
  </div>

  <div class="status-bar">
    <div class="status-dot checking" id="status-dot"></div>
    <span class="status-text" id="status-text">Loading...</span>
  </div>

  <div class="section">
    <div class="label">HTTP Endpoint</div>
    <div class="field">
      <input type="url" id="endpoint-url" placeholder="http://localhost:3000/annotations">
      <button class="btn" id="save-endpoint">Save</button>
    </div>
    <div class="message" id="endpoint-message"></div>
  </div>

  <div class="ready-content">
    <p>Use the button below or keyboard shortcut.</p>
    <span class="shortcut" id="shortcut-key"></span>
    <button class="btn primary" id="start-btn" disabled>Start Annotation</button>
  </div>

  <div class="footer">
    On submit, the extension sends a JSON POST request to the configured endpoint.
  </div>

  <script src="popup.js"></script>
</body>
</html>
